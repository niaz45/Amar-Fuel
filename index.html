    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          const target = window.hasOwnProperty('fetch') ? window : Object.getPrototypeOf(window);
          const descriptor = Object.getOwnPropertyDescriptor(target, 'fetch');
          
          if (descriptor && descriptor.get && !descriptor.set) {
            const originalFetch = window.fetch;
            Object.defineProperty(target, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { 
                console.warn('Prevented attempt to overwrite read-only window.fetch');
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
  </head>

    <div id="root"></div>

  </body>
