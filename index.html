<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niaz FUELBD</title>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          const descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (descriptor && descriptor.get && !descriptor.set) {
            const originalFetch = window.fetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return originalFetch; },
                set: function(v) { 
                  console.warn('Attempted to overwrite window.fetch was ignored to prevent TypeError.');
                },
                configurable: true
              });
            } catch (e) {
              // Fallback: try to make it writable if the above failed
              try {
                Object.defineProperty(window, 'fetch', {
                  value: originalFetch,
                  writable: true,
                  configurable: true
                });
              } catch (e2) {
                // If both fail, it's likely not configurable
              }
            }
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
